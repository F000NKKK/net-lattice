[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
edition = "2024"
rust-version = "1.93"
license = "MPL-2.0"
repository = "https://github.com/F000NKKK/net-lattice"
homepage = "https://github.com/F000NKKK/net-lattice"
documentation = "https://docs.rs/net-lattice"
authors = ["Net Lattice Contributors", "F000NK"]
categories = ["network-programming", "os"]
keywords = ["networking", "netlink", "cross-platform", "systems", "os"]

# Single source of truth for every internal crate's version + path. Member
# crates reference these as `net-lattice-foo = { workspace = true }` instead
# of repeating path/version — see ARCHITECTURE.md's API Stability Rules for
# why each crate's version is independent rather than tied to a single
# workspace-wide number.
[workspace.dependencies]
net-lattice-core = { path = "crates/net-lattice-core", version = "0.6.0" }
net-lattice-ip = { path = "crates/net-lattice-ip", version = "0.5.0" }

net-lattice-model = { path = "crates/net-lattice-model", version = "0.18.1" }
net-lattice-platform = { path = "crates/net-lattice-platform", version = "0.17.0" }

net-lattice-backend-linux = { path = "crates/net-lattice-backend-linux", version = "0.19.1" }
net-lattice-backend-windows = { path = "crates/net-lattice-backend-windows", version = "0.19.1" }
net-lattice-backend-darwin = { path = "crates/net-lattice-backend-darwin", version = "0.19.1" }
net-lattice-async = { path = "crates/net-lattice-async", version = "0.9.0" }
net-lattice = { path = "crates/net-lattice", version = "0.21.1" }

bitflags = "2"
tokio = { version = "1", features = ["rt"] }
futures = "0.3"

rtnetlink = "0.23"
# `nftnl-1-2-0` is the lowest vendored-bindings baseline in `nftnl-sys` that
# compiles against this workspace's `nftnl` version at all (lower baselines
# lack `NFTNL_UDATA_RULE_COMMENT`, which `nftnl::Rule::set_comment` requires
# unconditionally) — chosen for maximum compatibility with older installed
# `libnftnl` versions, not because the build machine's `libnftnl` must be
# exactly 1.2.0. See net-lattice-backend-linux's README for the system
# `libmnl`/`libnftnl` development-package build requirement this introduces.
nftnl = { version = "0.9", features = ["nftnl-1-2-0"] }
mnl = "0.3"
windows = { version = "0.62", features = [
    "Win32_Foundation",
    "Win32_NetworkManagement_IpHelper",
    "Win32_NetworkManagement_Ndis",
    "Win32_NetworkManagement_WindowsFilteringPlatform",
    "Win32_Networking_WinSock",
    "Win32_Security",
    "Win32_System_Rpc",
] }
libc = { version = "0.2", features = ["extra_traits"] }
