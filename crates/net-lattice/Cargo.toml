[package]
name = "net-lattice"
version = "1.0.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
documentation.workspace = true
categories.workspace = true
keywords.workspace = true
description = "A modern, cross-platform Rust library for configuring and inspecting operating system networking through a single, strongly typed API."
readme = "README.md"

[features]
async = ["dep:net-lattice-async", "net-lattice-platform/async", "net-lattice-backend-linux/async", "net-lattice-backend-windows/async", "net-lattice-backend-darwin/async"]

[dependencies]
net-lattice-core = { workspace = true }
net-lattice-ip = { workspace = true }
net-lattice-model = { workspace = true }
net-lattice-platform = { workspace = true }
net-lattice-async = { workspace = true, optional = true }

[dev-dependencies]
futures = { workspace = true }

[[example]]
name = "async_monitor"
required-features = ["async"]

[package.metadata.docs.rs]
all-features = true
targets = ["x86_64-unknown-linux-gnu", "x86_64-pc-windows-msvc", "aarch64-apple-darwin"]

[target.'cfg(target_os = "linux")'.dependencies]
net-lattice-backend-linux = { workspace = true }

[target.'cfg(target_os = "windows")'.dependencies]
net-lattice-backend-windows = { workspace = true }

[target.'cfg(target_os = "macos")'.dependencies]
net-lattice-backend-darwin = { workspace = true }
