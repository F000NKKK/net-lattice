[package]
name = "net-lattice-backend-linux"
version = "2.0.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
documentation = "https://docs.rs/net-lattice-backend-linux"
categories.workspace = true
keywords.workspace = true
description = "Linux backend for Net Lattice: implements net-lattice-platform's provider traits via Netlink."
readme = "README.md"

[features]
async = ["net-lattice-platform/async"]

[target.'cfg(target_os = "linux")'.dependencies]
net-lattice-core = { workspace = true }
net-lattice-ip = { workspace = true }
net-lattice-model = { workspace = true }
net-lattice-platform = { workspace = true }

rtnetlink = { workspace = true }
netlink-sys = { version = "0.9", default-features = false }
libc = { workspace = true }
nftnl = { workspace = true }
mnl = { workspace = true }

[target.'cfg(target_os = "linux")'.dev-dependencies]
tokio = { workspace = true, features = ["rt-multi-thread"] }
futures = { workspace = true }
rtnetlink = { workspace = true, features = ["tokio_socket"] }
async-io = "2.6"
