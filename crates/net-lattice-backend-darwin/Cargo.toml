[package]
name = "net-lattice-backend-darwin"
version = "1.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
documentation.workspace = true
categories.workspace = true
keywords.workspace = true
description = "BSD/macOS backend for Net Lattice: implements net-lattice-platform's provider traits via route sockets."
readme = "README.md"

[features]
async = ["net-lattice-platform/async"]

[target.'cfg(target_os = "macos")'.dependencies]
net-lattice-core = { workspace = true }
net-lattice-ip = { workspace = true }
net-lattice-model = { workspace = true }
net-lattice-platform = { workspace = true }

libc = { workspace = true }

[target.'cfg(target_os = "macos")'.dev-dependencies]
tokio = { workspace = true }
