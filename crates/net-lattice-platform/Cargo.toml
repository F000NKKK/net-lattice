[package]
name = "net-lattice-platform"
version = "0.18.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
documentation.workspace = true
categories.workspace = true
keywords.workspace = true
description = "Generic provider traits and Capability contract between the model and platform backends. Depends only on net-lattice-core — never on net-lattice-model."
readme = "README.md"

[features]
async = ["dep:tokio"]

[dependencies]
net-lattice-core = { workspace = true }
bitflags = { workspace = true }
tokio = { workspace = true, optional = true, features = ["sync"] }
