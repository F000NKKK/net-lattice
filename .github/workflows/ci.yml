name: CI

# Runs on each of the three platforms this project actually ships backends
# for (net-lattice-backend-linux/-windows/-darwin), on GitHub's native
# runners for each OS — not cross-compiled — so platform-specific code
# (raw FFI structs, ioctl/Netlink/IP-Helper calls) is compiled *and*
# clippy-linted on the real target instead of only ever building on Linux.
# Each backend crate is `#![cfg(target_os = "...")]`-gated, so a workspace
# build/clippy/test run on a given OS naturally only touches that OS's
# backend plus the OS-agnostic crates — no extra target selection needed.

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  coverage:
    name: coverage (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    env:
      # Keep coverage artifacts job-local and outside the checkout. `runner`
      # is not available in a job-level `env`, so use a sibling of the
      # checkout instead. Privileged native tests add profiles to this same
      # location after regular tests have built the instrumented binaries.
      CARGO_TARGET_DIR: ${{ github.workspace }}/../net-lattice-coverage-target
      LLVM_PROFILE_FILE: ${{ github.workspace }}/../net-lattice-%p-%m.profraw
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust (MSRV with coverage tools)
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.93"
          components: rustfmt, clippy, llvm-tools-preview

      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@v2.86.1
        with:
          tool: cargo-llvm-cov

      # v2.9.1 uses the current Node action runtime; do not suppress runtime
      # warnings with NODE_OPTIONS.
      - uses: Swatinem/rust-cache@v2.9.2
        with:
          key: coverage-${{ matrix.os }}
          cache-targets: false

      - name: cargo fmt --check
        run: cargo fmt --check

      - name: cargo clippy --workspace --all-targets --all-features -- -D warnings
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings

      - name: cargo check --workspace --all-features --examples
        run: cargo check --workspace --all-features --examples

      - name: cargo doc --no-deps --workspace --all-features
        run: cargo doc --no-deps --workspace --all-features

      # Build and run every ordinary synchronous and async test under LLVM
      # source-based coverage. The platform-specific root/Administrator
      # commands below reuse these instrumented artifacts and add profiles
      # for privileged mutation and event-delivery paths.
      - name: collect coverage from workspace tests
        run: cargo llvm-cov test --workspace --all-features --no-report

      - name: collect coverage from privileged Linux tests
        if: matrix.os == 'ubuntu-latest'
        run: sudo env "PATH=$PATH" "HOME=$HOME" "CARGO_TARGET_DIR=$CARGO_TARGET_DIR/llvm-cov-target" "LLVM_PROFILE_FILE=$LLVM_PROFILE_FILE" cargo llvm-cov test -p net-lattice-backend-linux --all-features --no-report -- --ignored --nocapture

      - name: collect facade transaction coverage on privileged Linux
        if: matrix.os == 'ubuntu-latest'
        run: sudo env "PATH=$PATH" "HOME=$HOME" "CARGO_TARGET_DIR=$CARGO_TARGET_DIR/llvm-cov-target" "LLVM_PROFILE_FILE=$LLVM_PROFILE_FILE" cargo llvm-cov test -p net-lattice --all-features --no-report -- --ignored --nocapture

      - name: collect coverage from privileged macOS tests
        if: matrix.os == 'macos-latest'
        run: sudo env "PATH=$PATH" "HOME=$HOME" "CARGO_TARGET_DIR=$CARGO_TARGET_DIR/llvm-cov-target" "LLVM_PROFILE_FILE=$LLVM_PROFILE_FILE" cargo llvm-cov test -p net-lattice-backend-darwin --all-features --no-report -- --ignored --nocapture

      - name: collect facade transaction coverage on privileged macOS
        if: matrix.os == 'macos-latest'
        run: sudo env "PATH=$PATH" "HOME=$HOME" "CARGO_TARGET_DIR=$CARGO_TARGET_DIR/llvm-cov-target" "LLVM_PROFILE_FILE=$LLVM_PROFILE_FILE" cargo llvm-cov test -p net-lattice --all-features --no-report -- --ignored --nocapture

      - name: collect coverage from privileged Windows tests
        if: matrix.os == 'windows-latest'
        run: $env:CARGO_TARGET_DIR = "$env:CARGO_TARGET_DIR/llvm-cov-target"; cargo llvm-cov test -p net-lattice-backend-windows --all-features --no-report -- --ignored --nocapture

      - name: collect facade transaction coverage on privileged Windows
        if: matrix.os == 'windows-latest'
        run: $env:CARGO_TARGET_DIR = "$env:CARGO_TARGET_DIR/llvm-cov-target"; cargo llvm-cov test -p net-lattice --all-features --no-report -- --ignored --nocapture

      # Keep the detailed report visible without making platform-specific
      # coverage percentages a release gate. Native backend coverage is
      # reported on its corresponding runner and can be raised incrementally.
      - name: report coverage
        run: cargo llvm-cov report --show-missing-lines
